# Roda o lint e os testes a cada push e pull request, em três versões do Node.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instala o ffmpeg (testes de figurinha)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run lint
      - run: npm test
